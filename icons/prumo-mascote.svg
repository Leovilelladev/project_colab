<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    #prumo-pivot{ transform-origin:256px 128px; animation:prumo-swing 3.6s ease-in-out infinite; }
    @keyframes prumo-swing{
      0%{transform:rotate(-7deg);}
      50%{transform:rotate(7deg);}
      100%{transform:rotate(-7deg);}
    }
    #prumo-blink{ transform-origin:256px 281px; animation:prumo-blink 4.2s ease-in-out infinite; }
    @keyframes prumo-blink{
      0%,88%,100%{transform:scaleY(1);}
      92%{transform:scaleY(0.08);}
    }
    @media (prefers-reduced-motion: reduce){
      #prumo-pivot, #prumo-blink{ animation:none; }
    }
  </style>
  <g id="prumo-pivot">
    <line x1="256" y1="128" x2="256" y2="206" stroke="#16233A" stroke-width="9" stroke-linecap="round"/>
    <circle cx="256" cy="114" r="15" fill="none" stroke="#16233A" stroke-width="9"/>
    <path d="M256,206 C300,206 377,236 377,291 C377,341 330,396 256,467 C182,396 135,341 135,291 C135,236 212,206 256,206 Z" fill="#C2792E"/>
    <circle cx="256" cy="291" r="64" fill="#F7F5EF"/>
    <g id="prumo-blink">
      <circle cx="228" cy="281" r="11" fill="#16233A"/>
      <circle cx="284" cy="281" r="11" fill="#16233A"/>
    </g>
    <path d="M228,301 Q256,317 284,301" stroke="#16233A" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
